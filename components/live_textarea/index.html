<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17212b;
        --muted: #7a8190;
        --line: #dfe3eb;
        --field: #ffffff;
        --gutter: #f7f7fb;
        --focus: #8b5cf6;
        --issue: rgba(245, 158, 11, 0.18);
        --issue-line: rgba(245, 158, 11, 0.75);
        --ok-bg: #ecfdf3;
        --ok-line: #bbf7d0;
        --ok-fg: #067647;
        --warn-bg: #fffbeb;
        --warn-line: #d97706;
        --warn-fg: #92400e;
        --over-bg: #fef2f2;
        --over-line: #dc2626;
        --over-fg: #991b1b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f8fafc;
          --muted: #94a3b8;
          --line: #334155;
          --field: #0f172a;
          --gutter: #111827;
          --focus: #a78bfa;
          --issue: rgba(245, 158, 11, 0.22);
          --issue-line: rgba(251, 191, 36, 0.85);
          --ok-bg: #052e1a;
          --ok-line: #047857;
          --ok-fg: #bbf7d0;
          --warn-bg: #451a03;
          --warn-line: #f59e0b;
          --warn-fg: #fde68a;
          --over-bg: #450a0a;
          --over-line: #ef4444;
          --over-fg: #fecaca;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        color: var(--ink);
        font-family: Inter, Arial, Helvetica, sans-serif;
      }

      .shell {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }

      .shell:focus-within {
        border-color: var(--focus);
        box-shadow: 0 0 0 1px var(--focus);
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 2.35rem;
        padding: 0.48rem 0.72rem;
        border-bottom: 1px solid var(--line);
        background: var(--field);
      }

      label {
        color: var(--ink);
        font-size: 0.84rem;
        font-weight: 750;
      }

      .saved {
        border-radius: 999px;
        padding: 0.22rem 0.62rem;
        background: var(--ok-bg);
        color: var(--ok-fg);
        font-size: 0.78rem;
        font-weight: 750;
      }

      .editor {
        display: grid;
        grid-template-columns: 3.35rem minmax(0, 1fr);
        background: var(--field);
      }

      .gutter {
        overflow: hidden;
        padding: 0.72rem 0.58rem 0.72rem 0.2rem;
        border-right: 1px solid var(--line);
        background: var(--gutter);
        color: var(--muted);
        font: 0.93rem/1.65 Consolas, "Cascadia Mono", Menlo, monospace;
        text-align: right;
        user-select: none;
        white-space: pre;
      }

      .pane {
        position: relative;
        overflow: hidden;
        background: var(--field);
      }

      .highlights {
        position: absolute;
        inset: 0;
        overflow: hidden;
        padding: 0.72rem 0;
        pointer-events: none;
        font: 0.93rem/1.65 Consolas, "Cascadia Mono", Menlo, monospace;
        white-space: pre;
      }

      .mark {
        border-left: 3px solid transparent;
        box-sizing: border-box;
      }

      .mirror {
        position: absolute;
        top: 0;
        left: 0;
        visibility: hidden;
        pointer-events: none;
        box-sizing: border-box;
        font: 0.93rem/1.65 Consolas, "Cascadia Mono", Menlo, monospace;
        padding: 0.72rem 0.95rem;
        border: 0;
        overflow: hidden;
        tab-size: 2;
      }

      .mirror-line {
        width: 100%;
        white-space: pre-wrap;
        word-wrap: break-word;
        box-sizing: border-box;
      }

      .gutter-line {
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        width: 100%;
        box-sizing: border-box;
      }

      .mark.issue {
        border-left-color: var(--issue-line);
        background: var(--issue);
      }

      textarea {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        min-height: 220px;
        padding: 0.72rem 0.95rem;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: 0.93rem/1.65 Consolas, "Cascadia Mono", Menlo, monospace;
        outline: none;
        overflow: auto;
        resize: none;
        tab-size: 2;
      }

      .counter {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.4rem 0.62rem;
        border-top: 1px solid var(--counter-line);
        background: var(--counter-bg);
        color: var(--counter-fg);
        font-size: 0.78rem;
        line-height: 1.2;
      }

      .count {
        font-weight: 750;
      }

      .hint {
        opacity: 0.82;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="head">
        <label id="label" for="textarea"></label>
        <span id="saved" class="saved">Saved</span>
      </div>
      <div class="editor">
        <div id="gutter" class="gutter"></div>
        <div class="pane">
          <div id="mirror" class="mirror"></div>
          <div id="highlights" class="highlights"></div>
          <textarea id="textarea" spellcheck="false"></textarea>
        </div>
      </div>
      <div id="counter" class="counter">
        <span id="count" class="count">0 chars</span>
        <span id="hint" class="hint"></span>
      </div>
    </div>

    <script>
      const textarea = document.getElementById("textarea");
      const label = document.getElementById("label");
      const gutter = document.getElementById("gutter");
      const highlights = document.getElementById("highlights");
      const counter = document.getElementById("counter");
      const count = document.getElementById("count");
      const hint = document.getElementById("hint");

      let suggestedChars = 4000;
      let issueLines = new Set();
      let initialized = false;
      let lastSeedToken = "";
      let sendTimer = null;
      let readyTimer = null;
      let readyAttempts = 0;
      let hasRendered = false;

      function post(type, data) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
      }

      function setFrameHeight() {
        post("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
      }

      function formatNumber(value) {
        return new Intl.NumberFormat().format(value);
      }

      const mirror = document.getElementById("mirror");

      function updateGutterAndHighlights() {
        const text = textarea.value;
        const lines = text.split("\n");
        
        // Sync mirror width with the actual client width of the textarea
        mirror.style.width = textarea.clientWidth + "px";
        
        // Populate the mirror element to measure line heights under wrapping
        mirror.innerHTML = "";
        const lineElements = [];
        for (let i = 0; i < lines.length; i++) {
          const div = document.createElement("div");
          div.className = "mirror-line";
          div.textContent = lines[i] === "" ? "\n" : lines[i];
          mirror.appendChild(div);
          lineElements.push(div);
        }
        
        // Retrieve client heights of each line under wrapping
        const heights = lineElements.map(el => el.getBoundingClientRect().height);
        
        // Populate gutter elements with matched heights
        let gutterHTML = "";
        for (let i = 0; i < lines.length; i++) {
          const lineNum = i + 1;
          gutterHTML += `<div class="gutter-line" style="height: ${heights[i]}px;">${lineNum}</div>`;
        }
        gutter.innerHTML = gutterHTML;
        
        // Populate highlights elements with matched heights
        let highlightsHTML = "";
        for (let i = 0; i < lines.length; i++) {
          const lineNum = i + 1;
          const hasIssue = issueLines.has(lineNum);
          highlightsHTML += `<div class="mark${hasIssue ? " issue" : ""}" style="height: ${heights[i]}px;"></div>`;
        }
        highlights.innerHTML = highlightsHTML;
      }

      function syncScroll() {
        gutter.scrollTop = textarea.scrollTop;
        highlights.style.transform = `translateY(${-textarea.scrollTop}px)`;
      }

      function updateCounter() {
        const length = textarea.value.length;
        const ratio = suggestedChars ? length / suggestedChars : 0;
        let background = "var(--ok-bg)";
        let border = "var(--ok-line)";
        let color = "var(--ok-fg)";
        let state = "suggested " + formatNumber(suggestedChars);

        if (ratio > 1) {
          background = "var(--over-bg)";
          border = "var(--over-line)";
          color = "var(--over-fg)";
          state = "above suggestion";
        } else if (ratio >= 0.85) {
          background = "var(--warn-bg)";
          border = "var(--warn-line)";
          color = "var(--warn-fg)";
          state = "near suggestion";
        }

        counter.style.setProperty("--counter-bg", background);
        counter.style.setProperty("--counter-line", border);
        counter.style.setProperty("--counter-fg", color);
        count.textContent = formatNumber(length) + " chars";
        hint.textContent = state;
      }

      function renderEditorChrome() {
        updateGutterAndHighlights();
        updateCounter();
        syncScroll();
        setFrameHeight();
      }

      function sendValue() {
        post("streamlit:setComponentValue", { value: textarea.value });
      }

      function scheduleSend() {
        window.clearTimeout(sendTimer);
        sendTimer = window.setTimeout(sendValue, 180);
      }

      function announceReady() {
        post("streamlit:componentReady", { apiVersion: 1 });
        setFrameHeight();
        readyAttempts += 1;
        if (!hasRendered && readyAttempts < 80) {
          readyTimer = window.setTimeout(announceReady, 250);
        }
      }

      function parseColor(value) {
        const color = String(value || "").trim();
        let match = color.match(/^#([0-9a-f]{3})$/i);
        if (match) {
          return match[1].split("").map(part => parseInt(part + part, 16));
        }
        match = color.match(/^#([0-9a-f]{6})$/i);
        if (match) {
          return [
            parseInt(match[1].slice(0, 2), 16),
            parseInt(match[1].slice(2, 4), 16),
            parseInt(match[1].slice(4, 6), 16),
          ];
        }
        match = color.match(/^rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)/i);
        if (match) {
          return [Number(match[1]), Number(match[2]), Number(match[3])];
        }
        return null;
      }

      function luminance(color) {
        const [red, green, blue] = color.map(channel => {
          const normalized = channel / 255;
          return normalized <= 0.03928
            ? normalized / 12.92
            : Math.pow((normalized + 0.055) / 1.055, 2.4);
        });
        return 0.2126 * red + 0.7152 * green + 0.0722 * blue;
      }

      function themeIsDark(theme) {
        const base = String(theme.base || "").toLowerCase();
        if (base === "dark") return true;
        if (base === "light") return false;
        const background = parseColor(theme.backgroundColor || theme.secondaryBackgroundColor);
        return background ? luminance(background) < 0.42 : false;
      }

      function applyTheme(theme) {
        if (!theme) return;
        const root = document.documentElement;
        const isDark = themeIsDark(theme);
        const text = theme.textColor || (isDark ? "#f8fafc" : "#17212b");
        const field = theme.backgroundColor || (isDark ? "#0f172a" : "#ffffff");
        const gutterBg = theme.secondaryBackgroundColor || (isDark ? "#111827" : "#f7f7fb");
        const border = isDark ? "#334155" : "#dfe3eb";

        root.style.colorScheme = isDark ? "dark" : "light";
        root.style.setProperty("--ink", text);
        root.style.setProperty("--field", field);
        root.style.setProperty("--gutter", gutterBg);
        root.style.setProperty("--line", border);
        root.style.setProperty("--focus", theme.primaryColor || (isDark ? "#a78bfa" : "#8b5cf6"));
        root.style.setProperty("--muted", isDark ? "#94a3b8" : "#7a8190");
      }

      textarea.addEventListener("input", () => {
        renderEditorChrome();
        scheduleSend();
      });

      textarea.addEventListener("scroll", syncScroll);
      textarea.addEventListener("blur", sendValue);

      window.addEventListener("message", event => {
        if (!event.data || event.data.type !== "streamlit:render") {
          return;
        }

        hasRendered = true;
        window.clearTimeout(readyTimer);

        const args = event.data.args || {};
        applyTheme(event.data.theme);
        suggestedChars = Number(args.suggested_chars || suggestedChars || 4000);
        issueLines = new Set((args.issue_lines || []).map(Number).filter(Number.isFinite));
        label.textContent = args.label || "";
        textarea.placeholder = args.placeholder || "";
        textarea.style.height = Number(args.height || 520) + "px";
        gutter.style.height = Number(args.height || 520) + "px";
        highlights.style.height = Number(args.height || 520) + "px";

        const incomingValue = typeof args.value === "string" ? args.value : "";
        const seedToken = String(args.seed_token || "");
        const shouldApplySeed = seedToken && seedToken !== lastSeedToken;
        if (!initialized || shouldApplySeed || (incomingValue && textarea.value.length === 0)) {
          textarea.value = incomingValue;
          initialized = true;
          lastSeedToken = seedToken;
        }

        renderEditorChrome();
      });

      announceReady();
    </script>
  </body>
</html>
